name: Build APK and ZN HYOS Probe

on:
  push:
    branches: [ main, 'feat/zn-hyos-runtime' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miweatherlocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build APK and native libraries
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Zygisk Next HYOS probe
        run: |
          SO="app/build/intermediates/cxx/Debug"
          HYOS_SO=$(find "$SO" -type f -name 'libmiweatherlocation_hyos.so' | head -n 1)
          test -n "$HYOS_SO" && test -s "$HYOS_SO"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$NM" -D "$HYOS_SO" | tee zn-symbols.txt
          grep -q ' zn_module$' zn-symbols.txt
          "$READELF" -lW "$HYOS_SO" > zn-elf-program-headers.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('zn-elf-program-headers.txt').read_text()
          aligns = []
          for line in text.splitlines():
              if re.match(r'^\s*LOAD\s', line):
                  m = re.search(r'(0x[0-9a-fA-F]+)\s*$', line)
                  if m:
                      aligns.append(int(m.group(1), 16))
          if not aligns or any(a < 0x4000 for a in aligns):
              raise SystemExit(f'Bad ELF LOAD alignment: {[hex(a) for a in aligns]}')
          PY
          grep -qx 'path=/system_ext/bin/hyos_spawner lib/arm64-v8a/libmiweatherlocation_hyos.so' zn-module/zn_modules.txt
          test -s zn-module/action.sh

      - name: Package Zygisk Next HYOS probe
        run: |
          rm -rf build/zn-module
          mkdir -p build/zn-module/lib/arm64-v8a
          cp zn-module/module.prop build/zn-module/
          cp zn-module/zn_modules.txt build/zn-module/
          cp zn-module/action.sh build/zn-module/
          chmod 0755 build/zn-module/action.sh
          HYOS_SO=$(find app/build/intermediates/cxx/Debug -type f -name 'libmiweatherlocation_hyos.so' | head -n 1)
          cp "$HYOS_SO" build/zn-module/lib/arm64-v8a/
          (cd build/zn-module && zip -9 -r ../../MiWeatherLocation-ZN-HYOS-Probe.zip .)
          unzip -l MiWeatherLocation-ZN-HYOS-Probe.zip
          sha256sum MiWeatherLocation-ZN-HYOS-Probe.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiWeatherLocation-ZN-HYOS-Probe
          path: |
            MiWeatherLocation-ZN-HYOS-Probe.zip
            app/build/outputs/apk/debug/app-debug.apk
