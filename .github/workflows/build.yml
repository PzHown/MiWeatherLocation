name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miweatherlocation-lsposed-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug APK with embedded native payload
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify modern Xposed Java and native entries
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== META-INF/xposed ==="
          unzip -l "$APK" | grep 'META-INF/xposed/'
          unzip -l "$APK" | grep -q 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep -q 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -q 'META-INF/xposed/native_init.list'
          unzip -l "$APK" | grep -q 'META-INF/xposed/scope.list'
          unzip -p "$APK" META-INF/xposed/native_init.list | grep -q '^libmiweatherlocation.so$'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmiweatherlocation.so'
          for DEX in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do
            unzip -p "$APK" "$DEX" | strings
          done | grep -q 'Lio/github/pzhown/miweathlocation/ModuleMain;'

      - name: Verify LSPosed native entrypoint
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" lib/arm64-v8a/libmiweatherlocation.so > /tmp/libmiweatherlocation.so
          test -s /tmp/libmiweatherlocation.so
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D /tmp/libmiweatherlocation.so | tee native-symbols.txt
          grep -q ' native_init$' native-symbols.txt
          grep -q ' JNI_OnLoad$' native-symbols.txt
          if grep -q 'zygisk_module_entry' native-symbols.txt; then
            echo "Unexpected Zygisk entrypoint remains" >&2
            exit 1
          fi

      - name: Prepare release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiWeatherLocation-debug.apk
          sha256sum MiWeatherLocation-debug.apk

      - name: Publish APK to debug-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest \
            MiWeatherLocation-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MiWeatherLocation LSPosed native debug latest" \
            --notes "Pure LSPosed single-APK build for Xiaomi Weather 18. Native payload is embedded in the APK; no MiWeatherLocation Magisk/Zygisk module is required."
