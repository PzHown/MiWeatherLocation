name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miweatherlocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 / API 37 SDK
        run: sdkmanager "platforms;android-CinnamonBun" "build-tools;37.0.0"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify modern Xposed metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== META-INF/xposed ==="
          unzip -l "$APK" | grep 'META-INF/xposed/'
          echo "=== module.prop ==="
          unzip -p "$APK" META-INF/xposed/module.prop
          echo "=== java_init.list ==="
          unzip -p "$APK" META-INF/xposed/java_init.list
          echo "=== scope.list ==="
          unzip -p "$APK" META-INF/xposed/scope.list
          unzip -l "$APK" | grep -q 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep -q 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -q 'META-INF/xposed/scope.list'
          for DEX in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do
            unzip -p "$APK" "$DEX" | strings
          done | grep -q 'Lio/github/pzhown/miweathlocation/ModuleMain;'

      - name: Prepare direct APK asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk MiWeatherLocation-debug.apk

      - name: Publish direct APK to debug-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest MiWeatherLocation-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MiWeatherLocation debug latest" \
            --notes "Automatically built from main. Direct APK download; no Actions artifact ZIP."
