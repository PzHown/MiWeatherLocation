name: Build APK + Zygisk

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miweatherlocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Fetch canonical Zygisk API header
        run: |
          mkdir -p native/include
          curl -fsSL \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp \
            -o native/include/zygisk.hpp
          grep -q '#define ZYGISK_API_VERSION' native/include/zygisk.hpp

      - name: Build Zygisk arm64 native module
        run: |
          cmake -S native -B native/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --parallel

      - name: Verify Zygisk native entrypoints
        run: |
          SO="native/build/libmiweatherlocation.so"
          test -s "$SO"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D "$SO" | tee native-symbols.txt
          grep -q 'zygisk_module_entry' native-symbols.txt
          grep -q 'zygisk_companion_entry' native-symbols.txt

      - name: Package flashable Zygisk ZIP
        run: |
          rm -rf native/module-stage MiWeatherLocation-zygisk.zip
          mkdir -p native/module-stage/zygisk
          cp native/module/module.prop native/module-stage/
          cp native/module/customize.sh native/module-stage/
          cp native/module/config.properties native/module-stage/
          cp native/build/libmiweatherlocation.so native/module-stage/zygisk/arm64-v8a.so
          chmod 0755 native/module-stage/customize.sh
          chmod 0644 native/module-stage/module.prop native/module-stage/config.properties
          chmod 0644 native/module-stage/zygisk/arm64-v8a.so
          (cd native/module-stage && zip -9 -r ../../MiWeatherLocation-zygisk.zip .)
          unzip -l MiWeatherLocation-zygisk.zip
          unzip -l MiWeatherLocation-zygisk.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -p MiWeatherLocation-zygisk.zip module.prop | grep -q '^id=miweatherlocation$'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify modern Xposed compatibility metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== META-INF/xposed ==="
          unzip -l "$APK" | grep 'META-INF/xposed/'
          unzip -l "$APK" | grep -q 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep -q 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -q 'META-INF/xposed/scope.list'
          for DEX in $(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$'); do
            unzip -p "$APK" "$DEX" | strings
          done | grep -q 'Lio/github/pzhown/miweathlocation/ModuleMain;'

      - name: Prepare release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiWeatherLocation-debug.apk
          sha256sum MiWeatherLocation-debug.apk MiWeatherLocation-zygisk.zip

      - name: Publish APK and Zygisk ZIP to debug-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest \
            MiWeatherLocation-debug.apk \
            MiWeatherLocation-zygisk.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MiWeatherLocation native debug latest" \
            --notes "Weather 18 native/Rust alpha. Install the APK for configuration/logs and flash the Zygisk ZIP for process injection. Real location is not spoofed."
